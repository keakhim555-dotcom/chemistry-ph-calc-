<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH Calculator - Pro Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;700&display=swap');

        :root {
            --primary: #4f46e5;
            --acid-color: #ef4444;
            --base-color: #10b981;
            --neutral-color: #3b82f6;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1f2937;
        }

        .main-wrapper { width: 100%; max-width: 800px; }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        h2 { text-align: center; margin-top: 0; color: var(--primary); font-size: 22px; }

        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #4b5563; }

        select, input {
            width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb;
            border-radius: 12px; font-size: 15px; outline: none; box-sizing: border-box;
        }

        .mixture-inputs {
            display: none; grid-template-columns: 1fr 1fr; gap: 15px;
            background: #f9fafb; padding: 15px; border-radius: 15px; margin-bottom: 15px;
        }

        button {
            width: 100%; padding: 14px; background: var(--primary); color: white;
            border: none; border-radius: 12px; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: 0.2s;
        }

        .btn-export { background: #10b981; margin-right: 5px; }
        .btn-clear { background: #ef4444; }

        #result-display {
            margin-top: 25px; padding: 20px; border-radius: 16px;
            text-align: center; display: none;
        }

        .details-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;
            background: rgba(255,255,255,0.3); padding: 10px; border-radius: 10px;
        }

        .history-card {
            background: rgba(255, 255, 255, 0.9); padding: 20px;
            border-radius: 20px; max-height: 500px; overflow-y: auto;
        }

        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { text-align: left; font-size: 12px; color: #6b7280; padding: 10px; border-bottom: 1px solid #eee; }
        td { padding: 10px; border-bottom: 1px solid #f3f4f6; font-size: 12px; }

        .acid-bg { background: var(--acid-color); color: white; }
        .base-bg { background: var(--base-color); color: white; }
        .neutral-bg { background: var(--neutral-color); color: white; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="card">
        <h2>🧪 គណនា pH និង pH ល្បាយក្រោយប្រតិកម្មនៅសីណ្ហភាព 25&deg;C</p></h2>
        
        <div class="input-group">
            <label>ប្រភេទការគណនា</label>
            <select id="calcType" onchange="toggleInputs()">
                <option value="h3o">ម៉ូណូអាស៊ីតខ្លាំង (Cₐ) = [H₃O⁺] </option>
                <option value="oh">ម៉ូណូបាសខ្លាំង (Cb) = [OH⁻] </option>
                <option value="di_acid">ឌីអាស៊ីតខ្លាំង (Cₐ)</option>
                <option value="di_base">ឌីបាសខ្លាំង (Cb)</option>
                <option value="from_ph">រកកំហាប់ [H₃O⁺] ពីតម្លៃ pH</option>
                <option value="from_poh">រកកំហាប់ [OH⁻] ពីតម្លៃ pOH</option>
                <option disabled>──────────</option>
                <option value="mix_m_m">អត្រាកម្មរវាង ៖ ម៉ូណូអាស៊ីតខ្លាំង + ម៉ូណូបាសខ្លាំង</option>
                <option value="mix_d_m">អត្រាកម្មរវាង ៖ ឌីអាស៊ីតខ្លាំង + ម៉ូណូបាសខ្លាំង</option>
                <option value="mix_m_d">អត្រាកម្មរវាង  ៖ ម៉ូណូអាស៊ីតខ្លាំង + ឌីបាសខ្លាំង</option>
            </select>
        </div>

        <div id="singleInputGroup" class="input-group">
            <label id="inputLabel">កំហាប់ជាម៉ូលេ (mol/L)</label>
            <input type="number" id="inputVal" step="any" placeholder="បញ្ចូលលេខទីនេះ...">
        </div>

        <div id="mixtureInputs" class="mixture-inputs">
            <div><label>កំហាប់អាស៊ីត (mol/L)</label><input type="number" id="ca" step="any"></div>
            <div><label> មាឌអាស៊ីត (mL)</label><input type="number" id="va" step="any"></div>
            <div><label>កំហាប់បាស (mol/L)</label><input type="number" id="cb" step="any"></div>
            <div><label>មាឌបាស (mL)</label><input type="number" id="vb" step="any"></div>
        </div>

        <button onclick="processCalculation()">គណនាឥឡូវនេះ</button>

        <div id="result-display">
            <p id="resStatusText" style="margin:0;">លទ្ធផលគណនាគឺ</p>
            <h1 id="resMainValue" style="font-size: 35px; margin: 5px 0;">--</h1> 
            <div id="resBadge" style="display:inline-block; padding: 5px 15px; border-radius: 20px; background: rgba(0,0,0,0.1);">Status</div>
            
            <div class="details-grid">
                <div>[H₃O⁺]: <span id="resH3O"></span></div>
                <div>[OH⁻]: <span id="resOH"></span></div>
                <div>pH: <span id="resPH2"></span></div>
                <div>pOH: <span id="resPOH"></span></div>
            </div>
            <div id="titration-info" style="margin-top: 15px; font-weight: bold; border-top: 1px solid rgba(255,255,255,0.5); padding-top: 10px; display: none;">
                <span id="titrationMsg"></span>
            </div>
        </div>
    </div>

    <div class="history-card" id="history-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="margin:0; font-size: 16px;">📜 ប្រវត្តិគណនា</h3>
            <div>
                <button class="btn-export" style="width:auto; padding: 5px 10px; font-size: 12px;" onclick="exportPDF()">Export PDF</button>
                <button class="btn-clear" style="width:auto; padding: 5px 10px; font-size: 12px;" onclick="clearHistory()">លុបប្រវត្តិ</button>
            </div>
        </div>
        <div style="overflow-x: auto;">
            <table id="historyTable">
                <thead>
                    <tr>
                        <th>ប្រភេទ</th>
                        <th>pH</th>
                        <th>pOH</th>
                        <th>[H₃O⁺]</th>
                        <th>[OH⁻]</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    window.onload = renderHistory;

    function formatSci(num) {
        let str = num.toExponential(2);
        let parts = str.split('e');
        if (parts.length === 2) {
            let exp = parseInt(parts[1]);
            return `${parts[0]} × 10<sup>${exp}</sup>`;
        }
        return str;
    }

    function toggleInputs() {
        const type = document.getElementById('calcType').value;
        const inputLabel = document.getElementById('inputLabel');
        document.getElementById('singleInputGroup').style.display = type.startsWith('mix') ? 'none' : 'block';
        document.getElementById('mixtureInputs').style.display = type.startsWith('mix') ? 'grid' : 'none';
        
        if(type === 'from_ph') inputLabel.innerText = "បញ្ចូលតម្លៃ pH (0-14)";
        else if(type === 'from_poh') inputLabel.innerText = "បញ្ចូលតម្លៃ pOH (0-14)";
        else inputLabel.innerText = "កំហាប់ជាម៉ូលេ (mol/L)";

        // Reset Titration Display
        document.getElementById('titration-info').style.display = 'none';
    }

    function processCalculation() {
        const type = document.getElementById('calcType').value;
        const typeLabel = document.getElementById('calcType').options[document.getElementById('calcType').selectedIndex].text;
        let ph, h3o, oh, poh;
        let titrationText = "";

        if (type.startsWith('mix')) {
            const Ca = parseFloat(document.getElementById('ca').value);
            const Va = parseFloat(document.getElementById('va').value);
            const Cb = parseFloat(document.getElementById('cb').value);
            const Vb = parseFloat(document.getElementById('vb').value);
            
            if ([Ca, Va, Cb, Vb].some(isNaN)) { alert("សូមបញ្ចូលលេខឱ្យគ្រប់!"); return; }
            
            let na_fact = (type === 'mix_d_m') ? 2 : 1;
            let nb_fact = (type === 'mix_m_d') ? 2 : 1;
            
            let nH = na_fact * Ca * (Va/1000);
            let nOH = nb_fact * Cb * (Vb/1000);
            let Vtotal = (Va + Vb) / 1000;

            // គណនា pH
            if (nH > nOH) {
                h3o = (nH - nOH) / Vtotal;
                ph = -Math.log10(h3o);
            } else if (nOH > nH) {
                oh = (nOH - nH) / Vtotal;
                ph = 14 + Math.log10(oh);
            } else { ph = 7; }

            // គណនាមាឌបន្ថែមដើម្បី pH = 7 (nH = nOH)
            // na_fact * Ca * Va_needed = nb_fact * Cb * Vb_needed
            if (nH > nOH) {
                // លើសអាស៊ីត ត្រូវបន្ថែមបាស
                let Vb_needed = (na_fact * Ca * Va) / (nb_fact * Cb);
                let Vb_add = Vb_needed - Vb;
                titrationText = `ដើម្បីឱ្យ pH=7 ត្រូវបន្ថែមបាសចំនួន៖ ${Vb_add.toFixed(2)} mL`;
            } else if (nOH > nH) {
                // លើសបាស ត្រូវបន្ថែមអាស៊ីត
                let Va_needed = (nb_fact * Cb * Vb) / (na_fact * Ca);
                let Va_add = Va_needed - Va;
                titrationText = `ដើម្បីឱ្យសូលុយស្យុងល្បាយមាន pH=7 ត្រូវបន្ថែមអាស៊ីតចំនួន៖ ${Va_add.toFixed(2)} mL ។`;
            } else {
                titrationText = "សូលុយស្យុងមានលក្ខណៈណឺតស្រាប់ (pH=7)!";
            }
            
            document.getElementById('titrationMsg').innerText = titrationText;
            document.getElementById('titration-info').style.display = 'block';

        } else {
            document.getElementById('titration-info').style.display = 'none';
            const C = parseFloat(document.getElementById('inputVal').value);
            if (isNaN(C)) { alert("សូមបញ្ចូលតម្លៃ!"); return; }
            if(type === 'h3o') { h3o = C; ph = -Math.log10(h3o); }
            else if(type === 'di_acid') { h3o = 2 * C; ph = -Math.log10(h3o); }
            else if(type === 'oh') { oh = C; ph = 14 + Math.log10(oh); }
            else if(type === 'di_base') { oh = 2 * C; ph = 14 + Math.log10(oh); }
            else if(type === 'from_ph') { ph = C; }
            else if(type === 'from_poh') { ph = 14 - C; }
        }

        ph = Math.max(0, Math.min(14, ph));
        poh = 14 - ph;
        h3o = Math.pow(10, -ph);
        oh = Math.pow(10, -poh);

        displayResult(ph, poh, h3o, oh, type);
        saveToHistory(typeLabel, ph, poh, h3o, oh);
    }

    function displayResult(ph, poh, h3o, oh, type) {
        const display = document.getElementById('result-display');
        const resMain = document.getElementById('resMainValue');
        const resText = document.getElementById('resStatusText');

        if(type === 'from_poh') {
            resText.innerText = "កំហាប់អ៊ីយ៉ុង [OH⁻] គឺ";
            resMain.innerHTML = formatSci(oh);
        } else if(type === 'from_ph') {
            resText.innerText = "កំហាប់អ៊ីយ៉ុង [H₃O⁺] គឺ";
            resMain.innerHTML = formatSci(h3o);
        } else {
            resText.innerText = "pH នៃសូលុយស្យុងគឺ";
            resMain.innerText = ph.toFixed(2);
        }

        document.getElementById('resPH2').innerText = ph.toFixed(2);
        document.getElementById('resPOH').innerText = poh.toFixed(2);
        document.getElementById('resH3O').innerHTML = formatSci(h3o);
        document.getElementById('resOH').innerHTML = formatSci(oh);
        
        display.style.display = 'block';
        display.className = (ph < 6.95) ? 'acid-bg' : (ph > 7.05 ? 'base-bg' : 'neutral-bg');
        document.getElementById('resBadge').innerText = (ph < 6.95) ? "អាស៊ីត (Acid)" : (ph > 7.05 ? "បាស (Base)" : "ណឺត (Neutral)");
    }

    function saveToHistory(type, ph, poh, h3o, oh) {
        let history = JSON.parse(localStorage.getItem('phHistoryV3') || '[]');
        history.unshift({ 
            type, ph: ph.toFixed(2), poh: poh.toFixed(2), 
            h3o: formatSci(h3o), oh: formatSci(oh) 
        });
        localStorage.setItem('phHistoryV3', JSON.stringify(history.slice(0, 15)));
        renderHistory();
    }

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('phHistoryV3') || '[]');
        const tbody = document.querySelector('#historyTable tbody');
        tbody.innerHTML = history.map(item => `
            <tr>
                <td>${item.type}</td>
                <td><b>${item.ph}</b></td>
                <td>${item.poh}</td>
                <td>${item.h3o}</td>
                <td>${item.oh}</td>
            </tr>
        `).join('');
    }

    function clearHistory() {
        if(confirm("លុបប្រវត្តិទាំងអស់?")) {
            localStorage.removeItem('phHistoryV3');
            renderHistory();
        }
    }

    function exportPDF() {
        const element = document.getElementById('history-section');
        const opt = {
            margin:       10,
            filename:     'chemistry_history.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }
</script>
</body>
</html>
